on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-snapshot.yaml"
      - ".github/scripts/build-snapshot-release.R"

name: Update snapshot

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install R dependencies
        run: |
          install.packages("remotes")
          remotes::install_deps(dependencies = TRUE)
          remotes::install_local(dependencies = TRUE)
        shell: Rscript {0}

      - name: Build snapshot assets
        run: Rscript .github/scripts/build-snapshot-release.R

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view snapshot >/dev/null 2>&1 || \
            gh release create snapshot --title "medRxiv snapshot" --notes "Latest generated medRxiv snapshot."
          gh release upload snapshot snapshot-release/snapshot.csv.gz snapshot-release/snapshot-manifest.json --clobber
